name: Build & Release Jar

# Builds the mod jar for a dev branch and publishes it to ONE shared GitHub Release per build
# number, tagged <mod_version>-build-<build number> (e.g. 1.0.5-build-49) — all three branches' jars
# (differently named per MC version, so no filename collision) land in the same release instead
# of two separate releases, since they represent the same shipped change for two MC versions.
# A new release per build number, not one shared/overwritten release forever — so no need to
# run gradle locally to grab a build. The build number is shared across 1.21.x and
# 26.1.x (see "Bump shared build number" below), not tracked independently per branch.
# The correct JDK per branch (21 for 1.21.x's MC 1.21.1, 25 for
# 26.1.x's MC 26.1.2) is auto-provisioned by Gradle's own toolchain
# resolver (org.gradle.toolchains.foojay-resolver-convention, already
# configured in settings.gradle) — the runner JDK below is only what launches
# Gradle itself, not what compiles the mod.

on:
  push:
    branches:
      - 1.21.x
      - 26.1.x
      - 26.2.x
    # Doc-only edits (changelogs, wiki, README, API reference, any other markdown/docs asset)
    # have no effect on the built jar — don't burn a build number or spam a Discord release
    # notification for them. GitHub only skips the workflow when EVERY changed file in the
    # push matches one of these patterns — a push that also touches a single non-matching file
    # (e.g. README.md before it was added here) still runs the build, which is exactly what
    # happened for the doc-update push that added ScoreboardSystem.md/LeaderboardSystem.md:
    # docs/Wiki/** was covered, but README.md and docs/API.md weren't, so all three branches
    # built anyway. '**/*.md' + 'docs/**' between them cover every markdown file anywhere in
    # the repo (root-level changelogs/README, and everything under docs/, md or not — images,
    # dashboard-scaffold, etc.) so this class of push stays fully non-triggering going forward.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build numbers are shared across all three dev branches, representing "the same shipped
      # change" for two different MC versions — this repo's normal workflow is commit on
      # 1.21.x, cherry-pick the same commit to 26.1.x, push both. A branch REUSES the
      # current shared number if it hasn't built that number before (the common case: the other
      # branch just took it for this same cherry-picked change), and only bumps to the next
      # number once it finds it's already used the current one (a genuinely new change). This
      # keeps a cherry-picked pair on matching numbers (e.g. both land on build 48) while still
      # never reusing a number within the same branch.
      #
      # An earlier version bumped on every single push regardless, which meant a cherry-picked
      # pair always ended up on two different numbers (one branch takes N, the other takes
      # N+1) even though they ship the same change — not useful for telling "these two jars are
      # the same release for two MC versions" apart from "these are two different releases".
      #
      # The counter of record is a repository Actions variable (BUILD_NUMBER), NOT
      # build_number.txt committed to the branch — every git-based way of landing a bump commit
      # (plain push, push via a fresh throwaway branch, GitHub's own Contents API + a PR
      # auto-merged via the API) was tried and confirmed live to get rejected by this repo's
      # branch-protection ruleset (1.21.x/26.1.x both require signed commits AND
      # changes to land via a reviewed pull request, and that ruleset's target is ~ALL branches
      # — even a brand new throwaway branch with no PR involved hit the same rejection). Adding
      # GitHub Actions to the ruleset's bypass list didn't reliably fix it either. A repository
      # variable sidesteps all of that: it isn't part of git history, so branch protection
      # never enters the picture.
      #
      # build_number.txt IS still written to the workspace below (from the current/bumped
      # variable) so ./gradlew build picks it up for the version string — it's just not
      # committed back. The copy checked into each branch is local-dev-only now (see
      # build.gradle's comment); it will drift from the real shared counter over time, and
      # that's fine.
      #
      # GITHUB_TOKEN can't read/write repo variables at all (confirmed live — HTTP 403
      # "Resource not accessible by integration", regardless of the `actions: write` permission):
      # the Variables API requires real admin-level credentials, which the default workflow
      # token structurally never has. CI_BUILD_NUMBER_PAT is a fine-grained PAT scoped to only
      # "Variables: Read and write" on this one repo (stored as a repo secret) — the minimum
      # credential that can actually do this. It's deliberately NOT used for the release-existence
      # check below (that uses the default GITHUB_TOKEN via `github.token`, which already has
      # the Contents read access releases need) — the PAT's scope is intentionally as narrow as
      # possible, not a general-purpose repo credential.
      #
      # Read straight from gradle.properties rather than parsing it back out of the built jar's
      # filename — all three branches are expected to stay version-locked together (same convention
      # the shared build-number counter below already assumes: a cherry-picked pair ships "the
      # same change" for two MC versions), so this is a single mod_version, not a per-branch one.
      # If that ever stops being true, the shared-release-per-tag model below stops making sense
      # anyway and needs a rethink beyond just this line. Read before the build-number bump since
      # that step's own release lookup needs the final tag format too (see below).
      - name: Read mod version
        id: mod_version
        run: echo "value=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      # Since all three branches now publish into the SAME shared release tag
      # (<mod_version>-build-<number>), "has THIS branch already published under the current
      # number" can no longer be answered by "does a release with this tag exist" (it always
      # will, once either branch has published) — instead it checks whether the shared release
      # ALREADY HAS an asset carrying this branch's marker. The marker is just the branch name
      # itself (github.ref_name) — build.gradle's version string embeds gradle.properties'
      # version_label, which is kept identical to the branch name on every branch (e.g. the
      # 26.1.x branch's jar filename contains "26.1.x"), so no separate mapping is needed here
      # the way there was before version_label existed.
      - name: Bump shared build number
        id: build_number
        env:
          MOD_VERSION: ${{ steps.mod_version.outputs.value }}
        run: |
          marker="${{ github.ref_name }}"

          current=$(GH_TOKEN="${{ secrets.CI_BUILD_NUMBER_PAT }}" gh api "repos/${{ github.repository }}/actions/variables/BUILD_NUMBER" --jq '.value') || current=0
          assets=$(GH_TOKEN="${{ github.token }}" gh release view "${MOD_VERSION}-build-${current}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null) || assets=""
          if echo "$assets" | grep -q "$marker"; then
            next=$((current + 1))
            GH_TOKEN="${{ secrets.CI_BUILD_NUMBER_PAT }}" gh variable set BUILD_NUMBER --repo "${{ github.repository }}" --body "$next"
          else
            next=$current
          fi
          echo "$next" > build_number.txt
          echo "value=$next" >> "$GITHUB_OUTPUT"

      - name: Build jar
        run: ./gradlew build -x test --console=plain

      - name: Locate built jar
        id: jar
        run: |
          jar_path=$(ls -t build/libs/*.jar | head -n 1)
          echo "path=${jar_path}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jar_path}")" >> "$GITHUB_OUTPUT"

      # One release PER BUILD NUMBER (tag = <mod_version>-build-<number>), shared by BOTH branches — whichever
      # branch publishes first for a given number creates the release; the other branch's run
      # (same number, different jar filename — see the marker check above) updates that same
      # release, adding its jar as a second asset rather than creating a separate release. Each
      # NEW build number still gets its own fresh tag/release (not one release reused forever),
      # so GitHub's "released" webhook event still fires fresh every time a number is first used
      # — append_body appends this branch's line to the other branch's body instead of
      # overwriting it, so the combined release's description ends up listing both.
      - name: Publish build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mod_version.outputs.value }}-build-${{ steps.build_number.outputs.value }}
          name: "${{ steps.mod_version.outputs.value }} — Build ${{ steps.build_number.outputs.value }}"
          body: |
            `${{ github.ref_name }}`: commit ${{ github.sha }}.
          append_body: true
          target_commitish: ${{ github.sha }}
          files: ${{ steps.jar.outputs.path }}
          prerelease: true
          make_latest: false

      # Posts a rich embed to a Discord channel via webhook, linking straight to the GitHub
      # Release asset above rather than uploading the jar through the webhook itself — Discord
      # webhook file attachments cap out at 8-100MB depending on the server's boost level, and
      # this project's jars routinely exceed that (HTTP 413). A GitHub release asset has no such
      # cap, and clicking the link/filename downloads the jar directly from GitHub.
      # Requires a repo secret DISCORD_BUILDS_WEBHOOK_URL (Discord channel → Edit Channel →
      # Integrations → Webhooks → Copy URL). Skipped (not failed) if that secret isn't
      # configured, so forks / other clones of this workflow don't break.
      # continue-on-error: a Discord outage shouldn't fail the actual release.
      - name: Post build to Discord
        continue-on-error: true
        env:
          DISCORD_BUILDS_WEBHOOK_URL: ${{ secrets.DISCORD_BUILDS_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          MOD_VERSION: ${{ steps.mod_version.outputs.value }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.value }}
          JAR_NAME: ${{ steps.jar.outputs.name }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          REPO: ${{ github.repository }}
        run: |
          # The secrets context can't be referenced in a step-level `if:` (GitHub Actions
          # rejects it at workflow-parse time — "Unrecognized named-value: 'secrets'"), so the
          # no-op-when-unset check happens here in the script instead.
          if [ -z "$DISCORD_BUILDS_WEBHOOK_URL" ]; then
            echo "DISCORD_BUILDS_WEBHOOK_URL not set — skipping Discord notification."
            exit 0
          fi
          # GitHub's release-asset download URL is fully predictable from the tag + filename —
          # no need to parse it back out of the release-creation step's output. Hitting this URL
          # (e.g. clicking it in Discord) downloads the jar directly, no GitHub UI involved.
          # Shared tag (no branch in it) — all three branches' jars live under the same release now.
          TAG="${MOD_VERSION}-build-${BUILD_NUMBER}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${JAR_NAME}"
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $(stat -c%s "$JAR_PATH") / 1048576 }")
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # jq builds the JSON payload so quotes/brackets in the branch/jar name (or anything
          # else user-controlled) can't break or inject into the request body.
          payload=$(jq -n \
            --arg branch "$BRANCH" \
            --arg release_title "${MOD_VERSION} — ${BRANCH} — build ${BUILD_NUMBER}" \
            --arg jar_name "$JAR_NAME" \
            --arg url "$DOWNLOAD_URL" \
            --arg size "${SIZE_MB} MB" \
            --arg ts "$TIMESTAMP" \
            '{
              embeds: [{
                author: { name: "NeoEssentials" },
                title: "🆕 Dev Release",
                color: 5793266,  # 0x5865F2 — Discord blurple
                url: $url,
                fields: [ { name: "Branch", value: $branch, inline: true } ],
                description: ("**" + $release_title + "**\n[" + $jar_name + "](" + $url + ")\n" + $size + " • [Download](" + $url + ")"),
                timestamp: $ts
              }]
            }')
          curl -sS -f \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_BUILDS_WEBHOOK_URL"
